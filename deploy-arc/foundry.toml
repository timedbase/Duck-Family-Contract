[profile.default]
src = "script"
out = "out"
libs = ["lib"]
solc = "0.8.36"
via_ir = true
optimizer = true
optimizer_runs = 150
fs_permissions = [{ access = "read", path = "../" }]
allow_paths = ["../"]
remappings = [
  "duck-launcher-contracts/=../duck-launcher-arc/",
  "duckraise-contracts/=../duckraise-arc/",
  "duck-incubation-contracts/=../duck-incubation-arc/",
  "common-contracts/=../common-arc/",
  "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts-upgradeable/lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[rpc_endpoints]
arc = "${ARC_RPC_URL}"
